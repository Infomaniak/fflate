name: Publish to Verdaccio

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Publish when the version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
          VERDACCIO_URL: ${{ secrets.VERDACCIO_URL }}
        run: |
          HOST=$(echo "$VERDACCIO_URL" | sed -E 's#^https?://##')
          echo "//$HOST/:_authToken=$NODE_AUTH_TOKEN" >> ~/.npmrc
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@infomaniak/fflate@$VERSION" version --registry "$VERDACCIO_URL" >/dev/null 2>&1; then
            echo "@infomaniak/fflate@$VERSION already on Verdaccio, skipping"
          else
            npm publish --registry "$VERDACCIO_URL"
          fi
